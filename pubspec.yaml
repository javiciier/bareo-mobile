# https://dart.dev/tools/pub/pubspec
name: bareo_mobile
description: "An app to create, discover and rate routes of leisure and night life."
publish_to: 'none'

version: 0.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9

  # Compilation and language support
  equatable: ^3.0.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  logging: ^1.3.0

  # Frameworks
  get_it: ^9.2.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0

  # Network
  http: ^1.6.0
  dio: ^5.11.1

  # State management
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  redux_thunk: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
  # https://flutter.dev/to/resolution-aware-images
