# https://dart.dev/tools/pub/pubspec
name: bareo_mobile
description: "An app to create, discover and rate routes of leisure and night life."
publish_to: 'none'

version: 0.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9
  equatable: 2.1.0
  redux: 5.0.0
  flutter_redux: 0.10.0
  redux_thunk: 0.4.0
  get_it: 9.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

